<!DOCTYPE html>

<html>
<head>
    <title>Admin Login</title>

```
<link rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}">
```

</head>

<body>

```
<nav class="navbar">
    <div class="logo">
        🌾 Farmer Assistant
    </div>
</nav>

<div class="container">

    <div class="form-box">

        <h1>🔐 Admin Login</h1>

        <form method="POST">

            <label>Username</label>
            <input type="text"
                   name="username"
                   placeholder="Enter admin username"
                   required>

            <label>Password</label>
            <input type="password"
                   name="password"
                   placeholder="Enter admin password"
                   required>

            <button type="submit" class="btn">
                Admin Login
            </button>

        </form>

    </div>

</div>
```

</body>
</html>
