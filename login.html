<!DOCTYPE html>
<html>
<head>
    <title>Farmer Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">🌾 Farmer Assistant</div>

        <div>
            <a href="/">Home</a>
            <a href="/register">Register</a>
        </div>
    </nav>


    <div class="container">

        <div class="form-box">

            <h1>👨‍🌾 Farmer Login</h1>

            <p>Login to access your Farmer Assistant dashboard.</p>

            <br>

            <form method="POST">

                <label>Email</label>
                <input type="email"
                       name="email"
                       placeholder="Enter your email"
                       required>

                <label>Password</label>
                <input type="password"
                       name="password"
                       placeholder="Enter your password"
                       required>

                <button class="btn" type="submit">
                    Login
                </button>

            </form>

            <br>

            <p>
                Don't have an account?
                <a href="/register">Register here</a>
            </p>

        </div>

    </div>

</body>
</html>
